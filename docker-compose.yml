version: '3.8'

services:
  app:
    build: .
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOG_LEVEL=INFO
      - DATABASE_PATH=/app/data/open_early_education.db
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs
      - ./.open_early_education_assistant.json:/app/.open_early_education_assistant.json
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Optional: PostgreSQL database (if you want to upgrade from SQLite later)
  # db:
